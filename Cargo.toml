[package]
name = "iwcli"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/intellisoftalpin/iwcli"
homepage = "https://intelliwallet.io"
authors = ["IntelliSoftAlpin"]
description = "IntelliWallet CLI - command-line interface for password manager"
readme = "README.md"
keywords = ["password-manager", "cli", "encryption", "security", "tui"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "iwcli"
path = "src/main.rs"

[dependencies]
iwcore = "0.6.0"

clap = { version = "4.5", features = ["derive"] }
tempfile = "3.24"
rpassword = "7.3"
colored = "2.1"
rustyline = "14.0"
serde_json = "1.0"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# TOTP
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }
base32 = "0.5"
