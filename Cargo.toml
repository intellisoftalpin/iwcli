[package]
name = "iwcli"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/intellisoftalpin/iwcli"
homepage = "https://intelliwallet.io"
authors = ["IntelliSoftAlpin"]
description = "IntelliWallet CLI - command-line interface for password manager"
readme = "README.md"
keywords = ["password-manager", "cli", "encryption", "security", "tui"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "iwcli"
path = "src/main.rs"

[dependencies]
iwcore = "0.6.0"

clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
zeroize = "1.9"

# TUI (crossterm comes through ratatui::crossterm, so only one version is built)
ratatui = "0.30"

# TOTP
totp-rs = { version = "6.0", default-features = false, features = ["std", "otpauth", "zeroize"] }
base32 = "0.5"

[dev-dependencies]
zip = { version = "9.3", default-features = false, features = ["deflate"] }
